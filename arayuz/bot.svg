<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .goz { transform-origin: center; transform-box: fill-box; animation: kirp 5s infinite; }
    .anten { animation: isik 2.4s ease-in-out infinite; }
    @keyframes kirp { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes isik { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .goz, .anten { animation: none; } }
  </style>
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A6B"/>
      <stop offset="1" stop-color="#0B1B33"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#zemin)"/>
  <line x1="32" y1="12" x2="32" y2="18" stroke="#8FB4F0" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="anten" cx="32" cy="10.5" r="3" fill="#8FB4F0"/>
  <rect x="15" y="19" width="34" height="28" rx="10" fill="#FFFFFF"/>
  <rect class="goz" x="23" y="28" width="5" height="9" rx="2.5" fill="#0B1B33"/>
  <rect class="goz" x="36" y="28" width="5" height="9" rx="2.5" fill="#0B1B33"/>
</svg>
